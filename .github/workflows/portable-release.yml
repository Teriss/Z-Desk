name: Portable release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the artifact
        required: true
        default: 0.9.0

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '${{ github.ref_name }}'.TrimStart('v') }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish single-file portable build
        shell: pwsh
        run: .\scripts\publish-portable.ps1 -Output "artifacts\portable\ZDesk-${{ steps.version.outputs.value }}-win-x64"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Z-Desk ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: artifacts/portable/ZDesk-${{ steps.version.outputs.value }}-win-x64/ZDesk.exe
