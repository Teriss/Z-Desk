name: Portable release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          [xml]$props = Get-Content Directory.Build.props
          $projectVersion = ([string]($props.Project.PropertyGroup.ZDeskVersion | Select-Object -First 1)).Trim()
          Write-Host "Tag version: $version; project version: $projectVersion"
          if ($version -ne $projectVersion) { throw "Tag v$version does not match Directory.Build.props version $projectVersion." }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish single-file portable build
        shell: pwsh
        run: .\scripts\publish-portable.ps1 -Output "artifacts\portable\ZDesk-${{ steps.version.outputs.value }}-win-x64"

      - name: Generate checksum
        shell: pwsh
        run: |
          $path = "artifacts\portable\ZDesk-${{ steps.version.outputs.value }}-win-x64\ZDesk.exe"
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *ZDesk.exe" | Set-Content -LiteralPath "${path}.sha256" -NoNewline

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Z-Desk ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            artifacts/portable/ZDesk-${{ steps.version.outputs.value }}-win-x64/ZDesk.exe
            artifacts/portable/ZDesk-${{ steps.version.outputs.value }}-win-x64/ZDesk.exe.sha256
