name: Portable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the artifact
        required: true
        default: 0.9.0

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file portable build
        shell: pwsh
        run: .\scripts\publish-portable.ps1 -Output "artifacts\portable\ZDesk-${{ inputs.version }}-win-x64"

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZDesk-${{ inputs.version }}-win-x64-portable
          path: artifacts/portable/ZDesk-${{ inputs.version }}-win-x64/ZDesk.exe
          if-no-files-found: error
