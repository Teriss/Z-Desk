name: Bug report
description: Report a reproducible problem in Z-Desk
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues before submitting.
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Portable EXE
        - Inno Setup installer
        - Development build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove personal paths or file names before attaching logs.
