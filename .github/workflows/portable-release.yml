name: Portable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the artifact
        required: true
        default: 0.9.0

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file portable build
        shell: pwsh
        run: .\scripts\publish-portable.ps1 -Output "artifacts\portable\ZDesk-${{ inputs.version }}-win-x64"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Z-Desk ${{ inputs.version }}
          generate_release_notes: true
          files: artifacts/portable/ZDesk-${{ inputs.version }}-win-x64/ZDesk.exe
